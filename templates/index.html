<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Agent AI | Il tuo assistente in cucina</title>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Marked.js per il Markdown e i Link -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        :root {
            --chef-green: #2ecc71;
            --chef-orange: #e67e22;
            --bg-light: #f4f7f6;
            --glass-white: rgba(255, 255, 255, 0.9);
        }

        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar { 
            height: 100vh; 
            background: var(--glass-white); 
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0,0,0,0.1); 
            padding: 25px; 
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }

        .sidebar-title {
            color: var(--chef-orange);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #chat-window {
            height: calc(100vh - 150px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #chat-container { 
            flex-grow: 1;
            overflow-y: auto; 
            background: transparent;
            padding: 20px; 
            scroll-behavior: smooth;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg { 
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white; 
            padding: 12px 18px; 
            border-radius: 20px 20px 0 20px; 
            margin-bottom: 15px; 
            width: fit-content; 
            max-width: 75%; 
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            animation: slideIn 0.3s ease-out;
        }

        .agent-msg { 
            background: white; 
            color: #333; 
            padding: 15px 20px; 
            border-radius: 20px 20px 20px 0; 
            margin-bottom: 15px; 
            width: fit-content; 
            max-width: 80%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            animation: slideIn 0.3s ease-out;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* Stile per i link generati dall'agente */
        .agent-msg a {
            color: var(--chef-orange);
            text-decoration: underline;
            font-weight: 600;
        }

        .input-wrapper {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }

        .form-control {
            border: none;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .btn-send {
            background: var(--chef-green);
            color: white;
            border: none;
            border-radius: 10px;
            width: 50px;
            transition: all 0.3s;
        }

        .ing-item {
            background: #fff;
            border-left: 4px solid var(--chef-green);
            margin-bottom: 8px;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .typing {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
            display: none;
            font-style: italic;
            padding-left: 8px;
            border-left: 3px solid var(--chef-green);
        }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
        .form-control:disabled { opacity: 0.7; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3" id="sidebar">
            <h5 class="sidebar-title"><i class="fas fa-utensils"></i> La tua Dispensa</h5>
            <hr>
            <div id="inventory-content">
                <h6 class="text-muted small"><i class="fas fa-carrot"></i> INGREDIENTI</h6>
                <div id="list-ingredients" class="mb-4"></div>
                
                <h6 class="text-muted small"><i class="fas fa-heart"></i> PREFERENZE</h6>
                <div id="list-prefs" class="mb-4"></div>
                
                <h6 class="text-muted small"><i class="fas fa-exclamation-triangle"></i> VINCOLI</h6>
                <div id="list-constraints" class="mb-4"></div>

                <h6 class="text-muted small mt-3"><i class="fas fa-users"></i> CONTESTO</h6>
                <div id="list-context" class="mb-3">
                    <div class="ing-item p-2">
                        <small>Persone:</small> <strong id="val-persone" class="text-primary">?</strong><br>
                        <small>Occasione:</small> <strong id="val-occasione" class="text-primary">-</strong><br>
                        <small>Abilità:</small> <strong id="val-livello" class="text-primary">-</strong>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="col-md-9 p-4">
            <div id="chat-window">
                <div class="d-flex align-items-center mb-3">
                    <div class="bg-success text-white rounded-circle p-2 me-3" style="width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div>
                        <h4 class="mb-0">Chef Agent AI</h4>
                        <small class="text-success">Online • Pronto ad aiutarti</small>
                    </div>
                </div>

                <div id="chat-container">
                    <div class="agent-msg">Ciao! 👋 Sono lo Chef AI. Dimmi cosa hai in frigo, per quante persone cuciniamo e se ci sono allergie!</div>
                </div>
                
                <div id="typing-indicator" class="typing ms-3">Lo Chef sta pensando...</div>

                <div class="input-wrapper">
                    <div class="input-group">
                        <input type="text" id="user-input" class="form-control" placeholder="Scrivi qui..." onkeypress="if(event.key === 'Enter') sendMessage()">
                        <button class="btn btn-send" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configurazione Marked per aprire i link in una nuova scheda
    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
        return `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true });

    // Funzione di utilità per pulire i dati "string" o nulli inviati dall'AI
    function cleanValue(val, fallback = "?") {
        if (!val || val === "string" || val === "string()" || val === "string " || val.includes("...")) {
            return fallback;
        }
        return val;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const btn = document.querySelector('.btn-send');
        const chatContainer = document.getElementById('chat-container');
        const typing = document.getElementById('typing-indicator');
        const text = input.value.trim();

        if (!text) return;

        chatContainer.innerHTML += `<div class="user-msg">${text}</div>`;
        input.value = '';
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Disabilita input durante elaborazione
        input.disabled = true;
        btn.disabled = true;
        typing.style.display = 'block';
        typing.textContent = 'Sto analizzando la tua richiesta...';

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text})
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // Processa linee complete
                const lines = buffer.split('\n');
                buffer = lines.pop(); // mantieni l'ultima riga incompleta

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const payload = JSON.parse(line.slice(6));

                    if (payload.type === 'status') {
                        typing.textContent = payload.msg;
                    } else if (payload.type === 'done') {
                        typing.style.display = 'none';
                        const htmlContent = marked.parse(payload.data.messaggio_chat);
                        chatContainer.innerHTML += `<div class="agent-msg">${htmlContent}</div>`;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                        updateSidebar(payload.data.sidebar_data);
                    } else if (payload.type === 'error') {
                        typing.style.display = 'none';
                        const htmlContent = marked.parse(payload.data.messaggio_chat);
                        chatContainer.innerHTML += `<div class="agent-msg text-danger">${htmlContent}</div>`;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }
            }
        } catch (error) {
            typing.style.display = 'none';
            chatContainer.innerHTML += `<div class="agent-msg text-danger">Ops! Il server non risponde.</div>`;
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
    }

    function updateSidebar(data) {
        if (!data) return;

        // 1. Ingredienti
        const ingList = document.getElementById('list-ingredients');
        ingList.innerHTML = (data.ingredienti || []).map(i => {
            const tipo = cleanValue(i.tipo, "Nuovo ingrediente");
            const qta = cleanValue(i.quantita, "q.b.");
            const scad = cleanValue(i.scadenza, "?");
            
            return `
                <div class="ing-item p-2 mb-2">
                    <div class="d-flex justify-content-between">
                        <strong>${tipo}</strong>
                        <span class="badge bg-light text-dark">${qta}</span>
                    </div>
                    ${scad !== '?' ? `<div class="small text-danger mt-1"><i class="fas fa-clock"></i> Scad: ${scad}</div>` : ''}
                </div>
            `;
        }).join('');

        // 2. Preferenze
        const prefs = data.preferenze || [];
        document.getElementById('list-prefs').innerHTML = prefs
            .filter(p => p !== "string")
            .map(p => `<span class="badge rounded-pill bg-info text-dark me-1 mb-1 p-2">${p}</span>`)
            .join('');

        // 3. Vincoli
        const vincoli = data.vincoli || [];
        document.getElementById('list-constraints').innerHTML = vincoli
            .filter(v => v !== "string")
            .map(v => `<div class="alert alert-warning py-1 px-2 small mb-1"><i class="fas fa-shield-alt"></i> ${v}</div>`)
            .join('');

        // 4. Contesto
        if (data.contesto) {
            document.getElementById('val-persone').innerText = cleanValue(data.contesto.persone);
            document.getElementById('val-occasione').innerText = cleanValue(data.contesto.occasione, "-");
            document.getElementById('val-livello').innerText = cleanValue(data.contesto.livello_utente, "-");
        }
    }
</script>

</body>
</html>
